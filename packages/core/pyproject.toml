[project]
name = "arena-core"
version = "0.1.0"
description = "Shared core: boot checks, config, the deterministic scenario engine (S1), the agent port and the spend-guard client (S5 3, 4); the turn orchestrator, event store and observability land in later work packages (S5 1)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-genai==2.24.0",
  "jsonschema==4.26.0",
  "opentelemetry-api==1.42.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "referencing==0.37.0",
]

[build-system]
requires = ["uv_build==0.11.2"]
build-backend = "uv_build"
