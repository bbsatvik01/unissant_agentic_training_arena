# Supabase CLI project config (S4 2.1, Q9; WI-S4-01) for local development only: `supabase start` and
# `supabase db reset` apply supabase/migrations. The owner's hosted project is configured separately and only with
# owner approval (WI-S4-05, OD-2).
#
# None of the six arena schemas (arena, subject, sealed, ledger, training, ops) may ever appear in [api].schemas:
# a SECURITY DEFINER function in an exposed schema is callable over the Data API with the owner's privileges
# (S4 2.1). The browser never talks to the Data API (it talks only to arena-api), so the API is disabled outright.
# tools/check_supabase_config.py (make check) fails the build if an arena schema is listed here.
project_id = "unissant-arena"

[api]
enabled = false
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Local port of `supabase start` (the CLI default); 5432 belongs to another server on the workstation.
port = 54322
# The owner's Supabase project runs PostgreSQL 17 (17.11, with pgtap 1.3.3 and dblink).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# No seed data: the migrations seed only what the spend guard needs, and the one `global` bucket starts at $0
# until the operator applies cost_model.budget_plan() (D-012, D-013).
enabled = false
