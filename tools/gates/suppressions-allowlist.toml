# Verified false positives for tools/check_no_rigging.py (global hard gate: never rig, soften or
# bypass CI/tests). Each entry is one file, one marker and a substring of the exact line (`match`),
# with the reason it is a false positive. Entries that match nothing fail the gate. Adding an entry is
# a gate change: it needs its own review under the same global rule, never a routine edit.

[[allow]]
path = "tools/proc.py"
marker = "noqa"
match = "check=check)  # noqa: S603"
reason = "Ruff S603 flags every subprocess call whose argv is not all literals; this is the single call site, argv[0] is an allowlisted tool resolved to an absolute path, and no shell is used (verified false positive; lifted unchanged from TechnoMile tools/proc.py, ATTRIBUTIONS.md)"

[[allow]]
path = "tools/tests/subprocess_support.py"
marker = "noqa"
match = "subprocess.run(  # noqa: S603"
reason = "Ruff S603 flags every subprocess call whose argv is not all literals (sys.executable is dynamic); this is the single call site, argv is a fixed [interpreter, '-m', module] shape, there is no shell, and both cwd and env are caller-controlled (verified false positive; used only by the four service boot-check test suites, S5 1.4)"
