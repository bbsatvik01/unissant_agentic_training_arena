name: CodeQL

# S5 11.2: Python now; WP-18 adds javascript-typescript when web/ exists. The same scope and suite as the
# local gate (`make codeql`, tools/check_codeql.py): tools/codeql/python.yml for paths-ignore, the
# security-extended suite, and CodeQL 2.27.0 (the bundle linked to codeql-action v4.38.1 is the version
# tools/ensure_tools.sh pins). The SARIF is self-gated, so any finding fails the build on PRs and on main;
# `upload: never` because code scanning upload needs GitHub Advanced Security, which a private repo may not
# have. Structure adapted from Pangea adapi-av2 .github/workflows/codeql.yml (P6, pattern only; ATTRIBUTIONS.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          tools: linked
          queries: security-extended
          config-file: ./tools/codeql/python.yml

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          output: codeql-results
          upload: never

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results
          path: codeql-results

      # Blocking gate, with the validator `make codeql` uses (tools/check_codeql.py --sarif): any result
      # fails the build, and a missing, empty or malformed SARIF fails closed; it is never counted as zero
      # findings. Standard library only, so the runner's Python runs it without the project environment.
      - name: Fail on CodeQL findings
        if: always()
        run: python3 -m tools.check_codeql --sarif codeql-results/*.sarif
