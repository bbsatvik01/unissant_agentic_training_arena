name: pr-title

# Conventional prefixes per docs/handoff/PATTERNS.md. Structure adapted from Pangea adapi-av2
# .github/workflows/pr-title.yaml (P8, pattern only; ATTRIBUTIONS.md). The action reads the PR title from the
# event payload, so read access is enough (its README: pull-requests: read).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
