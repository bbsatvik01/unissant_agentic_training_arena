name: CI

# S5 11.2/11.3: CI calls the same make targets `make check` runs locally; there is no separately softened CI
# path. This workflow runs the Python half of the gate (`make deps-sync tools-sync py-check`: the test suite's
# gate proofs run the pinned CodeQL and gitleaks binaries) and the database half (`make deps-sync db-test`: the
# script starts its own disposable plain PostgreSQL 17 + pgTAP and Supabase Postgres 17 containers with the
# runner's Docker, on 127.0.0.1, and uses the runner's psql, so no service container is declared here);
# security.yml runs the rest of the security half; CodeQL (security-extended) runs only locally, inside
# `make sec-check` (`tools/check_codeql.py`) -- never as a GitHub Actions workflow, since code-scanning
# upload needs a GitHub Advanced Security license this private repo does not carry. web-check runs the
# same `make web-check` (pnpm install --frozen-lockfile && pnpm check: lint, typecheck, test, coverage,
# build) locally runs, with Node pinned from web/package.json's devEngines and pnpm activated through
# corepack from its packageManager field -- no separate action pins a Node or pnpm version. No path
# filter: push-clean and the other repository-policy gates run on every change, including a
# Markdown-only one. Actions are pinned to full commit SHAs; each comment names the release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  py-check:
    name: make py-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # ratchet, push-clean and diff-cover compare against the base commit
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # uv 0.11.2 = the [tool.uv] required-version floor; the action verifies the release checksum it ships.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"

      # BASE_REF is the state before the change (tools/ci_base_ref.sh): the PR's base commit on a PR, the
      # branch tip before the push on a push, the root commit on a first push or a manual run.
      - name: make deps-sync tools-sync py-check
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$(tools/ci_base_ref.sh)"
          make deps-sync tools-sync py-check BASE_REF="$base"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  db-test:
    name: make db-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"

      - name: make deps-sync db-test
        run: make deps-sync db-test

  web-check:
    name: make web-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Node pinned from web/package.json's devEngines.runtime (setup-node reads it natively).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json

      # pnpm itself: corepack (bundled with Node) reads web/package.json's packageManager field and
      # installs/activates that exact pinned version -- no separate action pins a pnpm version.
      - name: Activate the pinned pnpm (web/package.json packageManager)
        working-directory: web
        run: |
          corepack enable
          corepack install

      - name: make web-check
        run: make web-check
